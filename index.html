<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lily & Fox — Now Playing</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

body {
    position: relative;
}

/* Full-screen blurred album artwork */
#background {
    position: fixed;
    inset: -40px;
    background-position: center;
    background-size: cover;
    filter: blur(45px) brightness(0.42) saturate(1.25);
    transform: scale(1.15);
    transition: background-image 1s ease;
}

#shade {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.10),
            rgba(0,0,0,.22) 55%,
            rgba(0,0,0,.45)
        );
}

/* Main display */
#player {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 5vw;
    padding: 5vh 5vw 7vh;
}

#artwork {
    height: 82vh;
    width: 82vh;
    max-width: 54vw;
    object-fit: cover;
    border-radius: 2.5vh;
    box-shadow: 0 3vh 8vh rgba(0,0,0,.45);
    flex-shrink: 0;
    transition: opacity .5s ease;
}

#info {
    min-width: 0;
    flex: 1;
    text-shadow: 0 3px 15px rgba(0,0,0,.35);
}

#title {
    font-size: clamp(34px, 5.4vw, 84px);
    line-height: .98;
    font-weight: 800;
    letter-spacing: -0.04em;
    margin-bottom: 3vh;
    overflow-wrap: break-word;
}

#artist {
    font-size: clamp(23px, 3vw, 48px);
    line-height: 1.08;
    font-weight: 600;
    margin-bottom: 1.5vh;
}

#album {
    font-size: clamp(16px, 1.8vw, 28px);
    line-height: 1.2;
    opacity: .68;
}

/* Tiny progress line */
#progressTrack {
    position: fixed;
    z-index: 3;
    left: 0;
    right: 0;
    bottom: 0;
    height: 6px;
    background: rgba(255,255,255,.15);
}

#progress {
    width: 0%;
    height: 100%;
    background: rgba(255,255,255,.9);
    transition: width 1s linear;
}

/* Login / idle screens */
.overlay {
    position: fixed;
    z-index: 10;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    background: #121212;
    padding: 30px;
}

.overlay h1 {
    font-size: clamp(42px, 8vw, 100px);
    margin: 0 0 12px;
    letter-spacing: -0.05em;
}

.overlay p {
    font-size: clamp(18px, 2.5vw, 30px);
    opacity: .65;
    margin: 0 0 35px;
}

button {
    appearance: none;
    border: 0;
    border-radius: 999px;
    padding: 18px 32px;
    font-size: 20px;
    font-weight: 700;
    background: white;
    color: black;
    cursor: pointer;
}

#status {
    display: none;
}

#login {
    display: none;
}

.small-brand {
    position: fixed;
    z-index: 4;
    right: 2.5vw;
    bottom: 2.5vh;
    font-size: 13px;
    letter-spacing: .15em;
    font-weight: 700;
    opacity: .35;
}

/* Portrait fallback */
@media (orientation: portrait) {
    #player {
        flex-direction: column;
        justify-content: center;
        gap: 4vh;
    }

    #artwork {
        width: 70vw;
        height: 70vw;
        max-width: none;
    }

    #info {
        flex: 0;
        width: 85vw;
        text-align: center;
    }
}
</style>
</head>

<body>

<div id="background"></div>
<div id="shade"></div>

<div id="player">
    <img id="artwork" alt="">
    <div id="info">
        <div id="title"></div>
        <div id="artist"></div>
        <div id="album"></div>
    </div>
</div>

<div id="progressTrack">
    <div id="progress"></div>
</div>

<div class="small-brand">LILY &amp; FOX</div>

<div id="login" class="overlay">
    <h1>Lily &amp; Fox</h1>
    <p>Now Playing</p>
    <button id="loginButton">Connect Spotify</button>
</div>

<div id="status" class="overlay">
    <h1>Lily &amp; Fox</h1>
    <p id="statusText">Nothing playing</p>
</div>

<script>
const CLIENT_ID = "15e03401a81043dabb6ba5214dc739dc";
const REDIRECT_URI = "https://lilyfoxbakery.github.io/now-playing/";
const SCOPES = "user-read-currently-playing user-read-playback-state";

const loginScreen = document.getElementById("login");
const statusScreen = document.getElementById("status");
const statusText = document.getElementById("statusText");

let accessToken = null;
let refreshToken = null;
let expiresAt = 0;
let lastTrackId = null;

function randomString(length) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let result = "";
    const values = crypto.getRandomValues(new Uint8Array(length));

    for (let i = 0; i < length; i++) {
        result += chars[values[i] % chars.length];
    }
    return result;
}

async function sha256(text) {
    const data = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", data);
}

function base64url(buffer) {
    return btoa(String.fromCharCode(...new Uint8Array(buffer)))
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
}

async function beginLogin() {
    const verifier = randomString(64);
    const challenge = base64url(await sha256(verifier));

    localStorage.setItem("spotify_verifier", verifier);

    const params = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: "code",
        redirect_uri: REDIRECT_URI,
        scope: SCOPES,
        code_challenge_method: "S256",
        code_challenge: challenge
    });

    window.location =
        "https://accounts.spotify.com/authorize?" + params.toString();
}

async function exchangeCode(code) {
    const verifier = localStorage.getItem("spotify_verifier");

    const body = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: "authorization_code",
        code: code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
    });

    const response = await fetch(
        "https://accounts.spotify.com/api/token",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body
        }
    );

    if (!response.ok) {
        throw new Error("Spotify login failed");
    }

    const data = await response.json();
    saveTokens(data);

    history.replaceState({}, document.title, REDIRECT_URI);
}

function saveTokens(data) {
    accessToken = data.access_token;

    if (data.refresh_token) {
        refreshToken = data.refresh_token;
        localStorage.setItem("spotify_refresh", refreshToken);
    }

    expiresAt = Date.now() + (data.expires_in * 1000);

    localStorage.setItem("spotify_access", accessToken);
    localStorage.setItem("spotify_expiry", expiresAt);
}

async function refreshAccessToken() {
    refreshToken =
        refreshToken || localStorage.getItem("spotify_refresh");

    if (!refreshToken) {
        showLogin();
        return false;
    }

    const body = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: "refresh_token",
        refresh_token: refreshToken
    });

    const response = await fetch(
        "https://accounts.spotify.com/api/token",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body
        }
    );

    if (!response.ok) {
        showLogin();
        return false;
    }

    const data = await response.json();
    saveTokens(data);
    return true;
}

async function ensureToken() {
    if (!accessToken) {
        accessToken = localStorage.getItem("spotify_access");
        refreshToken = localStorage.getItem("spotify_refresh");
        expiresAt =
            Number(localStorage.getItem("spotify_expiry")) || 0;
    }

    if (!accessToken) return false;

    if (Date.now() > expiresAt - 60000) {
        return await refreshAccessToken();
    }

    return true;
}

function showLogin() {
    loginScreen.style.display = "flex";
    statusScreen.style.display = "none";
}

function showIdle(message = "Nothing playing") {
    loginScreen.style.display = "none";
    statusText.textContent = message;
    statusScreen.style.display = "flex";
}

function showPlayer() {
    loginScreen.style.display = "none";
    statusScreen.style.display = "none";
}

async function updateNowPlaying() {
    const valid = await ensureToken();

    if (!valid) {
        showLogin();
        return;
    }

    try {
        const response = await fetch(
            "https://api.spotify.com/v1/me/player/currently-playing",
            {
                headers: {
                    Authorization: "Bearer " + accessToken
                }
            }
        );

        if (response.status === 401) {
            await refreshAccessToken();
            return;
        }

        if (response.status === 204) {
            showIdle();
            return;
        }

        if (!response.ok) {
            return;
        }

        const data = await response.json();

        if (!data.item) {
            showIdle();
            return;
        }

        const track = data.item;
        const artwork =
            track.album.images && track.album.images.length
                ? track.album.images[0].url
                : "";

        showPlayer();

        if (track.id !== lastTrackId) {
            lastTrackId = track.id;

            document.getElementById("title").textContent =
                track.name;

            document.getElementById("artist").textContent =
                track.artists.map(a => a.name).join(", ");

            document.getElementById("album").textContent =
                track.album.name;

            document.getElementById("artwork").src =
                artwork;

            document.getElementById("background").style.backgroundImage =
                `url("${artwork}")`;
        }

        const percentage =
            data.duration_ms
                ? (data.progress_ms / track.duration_ms) * 100
                : (data.progress_ms / track.duration_ms) * 100;

        document.getElementById("progress").style.width =
            Math.min(100, percentage) + "%";

    } catch (error) {
        console.error(error);
    }
}

async function start() {
    document
        .getElementById("loginButton")
        .addEventListener("click", beginLogin);

    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    if (code) {
        try {
            await exchangeCode(code);
        } catch (e) {
            console.error(e);
            showLogin();
            return;
        }
    }

    const valid = await ensureToken();

    if (!valid) {
        showLogin();
        return;
    }

    updateNowPlaying();
    setInterval(updateNowPlaying, 4000);
}

start();
</script>

</body>
</html>
